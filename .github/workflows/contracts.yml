name: Contracts and browser infrastructure (not compatibility acceptance)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Real Chromium infrastructure regressions
        # Explicit software WebGL environment, recorded in the evidence. No fallback retry.
        run: node scripts/harness-smoke.mjs --software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-infrastructure-evidence
          path: test-results/infrastructure/
      - name: Report limited scope
        if: always()
        run: echo 'Real Chromium infrastructure self-tests only. No compatibility rendering or platform acceptance is claimed.' >> "$GITHUB_STEP_SUMMARY"
